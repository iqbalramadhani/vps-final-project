name: CI/CD Build & Deploy

on:
  push:
    branches: [ main ]

jobs:
  # JOB 1: Build & Test
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install & Test
        run: |
          npm install
          npm test

      - name: Create Artifact (Bungkus aplikasi)
        # Kita hapus node_modules dev dan simpan folder yang diperlukan saja
        run: |
          npm prune --production
          tar -czf app_artifact.tar.gz . 

      - name: Upload Artifact ke GitHub
        uses: actions/upload-artifact@v4
        with:
          name: node-app-bundle
          path: app_artifact.tar.gz

  # JOB 2: Deploy (Kirim Artifact ke VPS)
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact dari Job sebelumnya
        uses: actions/download-artifact@v4
        with:
          name: node-app-bundle

      - name: Kirim Artifact ke VPS (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "app_artifact.tar.gz"
          target: "/var/www/my-node-app"

      - name: Eksekusi Deployment di VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/my-node-app
            # Ekstrak artifact dan hapus file tar
            tar -xzf app_artifact.tar.gz
            rm app_artifact.tar.gz
            
            # Restart aplikasi dengan PM2
            pm2 delete simple-node-app || true
            pm2 start ecosystem.config.js
            pm2 save